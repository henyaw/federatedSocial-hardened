# Stalwart Mail Server — sidecar pattern, no host port bindings.
#
# The sidecar (ts-stalwart) joins the tailnet tagged tag:stalwart and gives
# Stalwart its only network interface. Mail ports (25/465/587/143/993) are
# exposed to the internet by the L4 edge caddy in stalwart/caddy/ — NOT here.
# Only JMAP/admin (8080) needs to be reachable from inside the tailnet (to
# the reverse proxy box).
#
# FIRST BOOT:
#   1. ./bootstrap.sh up stalwart
#      This generates config.runtime.json, starts the stack, then auto-runs
#      provision-stalwart which configures stores, domain, listeners, and
#      accounts from .env via the JMAP API. DNS records are printed to publish.
#   2. Configure ACME (DNS-01) in the admin UI after provisioning:
#      http://STALWART_MAGIC_NAME.TS_TAILNET:8080 → Settings → TLS → ACME
#   3. Restart Stalwart to bind newly-created listeners:
#      docker compose restart stalwart
#
# config.runtime.json only tells Stalwart where its Postgres database lives.
# All other config (listeners, PROXY trust, stores, DKIM, domain) is written
# to Postgres by provision-stalwart and managed via the admin UI thereafter.

name: federated-stalwart

services:

  ts-stalwart:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${STALWART_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:stalwart
      TS_HOSTNAME: ${STALWART_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    # Bootstrap DNS before Tailscale's MagicDNS is active.
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      # Gate on postgres AND garage — Stalwart's admin web SPA is stored in
      # S3 (Garage). If Garage isn't reachable on first boot, the UI blob
      # write fails silently and the admin site never loads. This is the exact
      # failure mode that motivated the nc-check pattern (see LESSONS.md).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${GARAGE_S3_ENDPOINT_NAME:-garage}.${TS_TAILNET} 3900"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  stalwart:
    # Tested against v0.16.7. Pin a specific tag in production — Stalwart has
    # had breaking config changes between minor versions.
    image: stalwartlabs/stalwart:${STALWART_VERSION:-v0.16.7}
    network_mode: "service:ts-stalwart"
    environment:
      # Bootstrap config: only STALWART_DB_PASSWORD is read from environment by
      # the config.json (via its EnvironmentVariable secret type). All other
      # configuration — TLS, ACME, SMTP, S3 endpoint/credentials/bucket, PROXY
      # protocol trust — is stored in Postgres and managed through the admin UI.
      # Do NOT configure S3 here via AWS_* env vars; Stalwart v0.16 does not
      # read them (S3 uses its own stored credentials, not the AWS SDK defaults).
      STALWART_DB_PASSWORD: ${STALWART_DB_PASSWORD}
      # Fallback admin credentials (used only if the DB is empty / first boot).
      STALWART_FALLBACK_ADMIN_SECRET: ${STALWART_FALLBACK_ADMIN_SECRET}
      # Cluster node identity (see README "Stalwart high availability"). This
      # is Stalwart's OWN env var — read at process start, before the DB is
      # even reachable — to derive this node's node-id lease. We feed it
      # STALWART_MAGIC_NAME (this host's own MagicDNS name), which is already
      # per-host and unique by convention (same pattern as GARAGE_MAGIC_NAME).
      #
      # NOT the same thing as .env's STALWART_HOSTNAME var below it, which is
      # the shared PUBLIC mail hostname (SMTP banner / SystemSettings, written
      # via JMAP by provision-stalwart) — they happen to share a name because
      # that's the literal env var Stalwart's binary reads, but they answer
      # different questions. Keep STALWART_HOSTNAME (.env) IDENTICAL across
      # every node; STALWART_MAGIC_NAME is the one that must differ per host.
      # Single-node: harmless — defaults to "stalwart", and uniqueness only
      # matters once a second node exists.
      STALWART_HOSTNAME: ${STALWART_MAGIC_NAME}
    volumes:
      # The runtime config is generated by `./bootstrap.sh up stalwart` from
      # the template in config/config.json. It is gitignored.
      - ./config/config.runtime.json:/etc/stalwart/config.json:ro
      # Working dir: ACME cert cache + outbound queue spool. Named volume so a
      # recreate doesn't orphan it and drop queued mail or certs.
      - stalwart-data:/var/lib/stalwart
    depends_on:
      ts-stalwart:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stalwart-data:

# IPv6 egress for the sidecar netns. Without it, Stalwart's MTA falls into the
# AAAA trap: it tries IPv6 first, gets ENETUNREACH, and for relay next-hops
# never falls back to A. A ULA subnet is enough — Docker masquerades it via
# ip6tables; no routable prefix, NDP proxy, or host sysctl needed.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:7a17:600d::/64
          gateway: fd00:7a17:600d::1
