# pg-router — nginx stream (L4 TCP) proxy that forwards the app-facing
# Postgres endpoint (DB_MAGIC_NAME) to whichever node is CURRENTLY the
# primary (PG_PRIMARY_MAGIC_NAME). See README "Postgres high availability".
#
# TRACKED TEMPLATE. Do not edit nginx.runtime.conf — it is generated from
# this file by `bootstrap.sh up pg-router` (and re-generated on failover by
# `bootstrap.sh pg-failover`), with __PG_PRIMARY_ADDR__ substituted from
# .env. The runtime file is gitignored.
#
# Single upstream, not a load-balancer: Postgres is single-writer, so the
# router points at exactly one node. Failover is a deliberate act — you
# promote the standby, then re-point this router at it (one command). The
# router never guesses which node is primary; it routes where you tell it.

worker_processes 1;
events { worker_connections 1024; }

stream {
    upstream pg_primary {
        # __PG_PRIMARY_ADDR__ = ${PG_PRIMARY_MAGIC_NAME}.${TS_TAILNET}:5432
        # A short fail_timeout means a dead primary is detected fast; there is
        # no second server to fail over to (that is the manual promote step).
        server __PG_PRIMARY_ADDR__ max_fails=1 fail_timeout=5s;
    }

    server {
        # Apps reach this on the pg-router sidecar's tailnet interface as
        # ${DB_MAGIC_NAME}.${TS_TAILNET}:5432 (the endpoint they always used).
        listen 5432;
        listen [::]:5432;

        proxy_pass            pg_primary;
        proxy_connect_timeout 5s;
        # Long-lived DB connections; keep the tunnel open.
        proxy_timeout         1h;
    }
}
