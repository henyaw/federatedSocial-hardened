# Funkwhale — four containers behind two Tailscale sidecars.
#
#   ts-funkwhale-web     → api (Gunicorn/ASGI) + front (nginx SPA), public-facing
#   ts-funkwhale-worker  → celeryworker + celerybeat, internal-only
#
# api and front share ts-funkwhale-web's network namespace so that the front
# nginx can proxy to the api on 127.0.0.1:5000 without a bridge network.
# celeryworker and celerybeat share ts-funkwhale-worker because both are
# internal-only and one tailnet identity covers both.
#
# Bring up shared-db/ first.
#
# First-boot operator steps (run once after `docker compose up -d`):
#
#   ./bootstrap.sh user-create funkwhale <username> <email>
#
# Or manually:
#
#   docker compose run --rm api funkwhale-manage migrate
#   docker compose run --rm api funkwhale-manage fw users create --superuser \
#       --username admin --email admin@example.com
#
# server.sh (api entrypoint) runs `migrate` and `collectstatic` automatically
# on every start. Both are idempotent — safe to run repeatedly.
#
# Version pinning: set FUNKWHALE_VERSION in .env. Using `latest` risks
# breaking schema changes on surprise upgrades; pin to a known-good release
# and bump deliberately. See https://docs.funkwhale.audio/changelog

name: federated-funkwhale

# Shared env for all API-tier containers (api, celeryworker, celerybeat).
x-api-env: &api-env
  FUNKWHALE_HOSTNAME: ${FUNKWHALE_DOMAIN}
  FUNKWHALE_PROTOCOL: https
  DJANGO_SECRET_KEY: ${FUNKWHALE_DJANGO_SECRET_KEY}
  DATABASE_URL: postgresql://${FUNKWHALE_DB_USER}:${FUNKWHALE_DB_PASSWORD}@${DB_MAGIC_NAME}.${TS_TAILNET}:5432/${FUNKWHALE_DB_NAME}
  # Password embedded in the URL — REDIS_APPS_PASSWORD must be URL-safe
  # (openssl rand -hex 32; see .env.example).
  CACHE_URL: redis://:${REDIS_APPS_PASSWORD}@${REDIS_MAGIC_NAME}.${TS_TAILNET}:6379/0
  MEDIA_ROOT: /srv/funkwhale/data/media
  STATIC_ROOT: /srv/funkwhale/data/static
  MUSIC_DIRECTORY_PATH: /music
  MUSIC_DIRECTORY_SERVE_PATH: /music
  DJANGO_SETTINGS_MODULE: config.settings.production
  LOGLEVEL: info
  # X-Accel-Redirect lets the front nginx serve media files directly.
  REVERSE_PROXY_TYPE: nginx
  FUNKWHALE_WEB_WORKERS: "4"
  CELERYD_CONCURRENCY: "0"
  # api and front share a network namespace; 127.0.0.1 is their shared lo.
  FUNKWHALE_API_IP: "127.0.0.1"
  FUNKWHALE_API_PORT: "5000"
  EMAIL_CONFIG: ${FUNKWHALE_EMAIL_CONFIG:-consolemail://}
  DEFAULT_FROM_EMAIL: ${FUNKWHALE_DEFAULT_FROM_EMAIL:-noreply@${FUNKWHALE_DOMAIN}}

  # ---- Object storage (S3 via Garage) — opt in ----
  # Set FUNKWHALE_S3_ENABLED=true in .env to store uploads in Garage instead of
  # the funkwhale-media volume. Funkwhale switches to S3 whenever
  # AWS_ACCESS_KEY_ID is non-empty, so the creds + endpoint below are gated on
  # the flag (blank => local volume). Uses the per-app Garage key
  # (FUNKWHALE_GARAGE_KEY_ID/SECRET) — scoped to funkwhale-music only.
  # NOTE: Funkwhale has NO OIDC/SSO support upstream (OAuth2 + LDAP only), so
  # this stack is S3-only — there is no Authelia client for it.
  AWS_ACCESS_KEY_ID: ${FUNKWHALE_S3_ENABLED:+${FUNKWHALE_GARAGE_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${FUNKWHALE_S3_ENABLED:+${FUNKWHALE_GARAGE_KEY_SECRET}}
  AWS_STORAGE_BUCKET_NAME: ${FUNKWHALE_S3_BUCKET:-funkwhale-music}
  AWS_S3_REGION_NAME: ${GARAGE_REGION:-garage}
  # Endpoint is built inline (Compose can't expand vars inside vars) and gated
  # on the flag — empty unless S3 is enabled.
  # GARAGE_S3_ENDPOINT_NAME defaults to the single node; point it at the
  # reverse-proxy host for the HA S3 load-balancer (README "Highly available
  # S3 endpoint").
  AWS_S3_ENDPOINT_URL: ${FUNKWHALE_S3_ENABLED:+http://${GARAGE_S3_ENDPOINT_NAME:-garage}.${TS_TAILNET}:3900}
  # Serve media through the front nginx via X-Accel-Redirect rather than handing
  # browsers direct Garage URLs — Garage's S3 API is tailnet-only and signed, so
  # direct URLs are unreachable publicly. Keeps S3 working with NO separate
  # public media host (unlike Mastodon/Pixelfed); the front fetches from Garage
  # over the tailnet (ACL: tag:funkwhale-web -> tag:garage:3900).
  PROXY_MEDIA: "true"

services:

  # -------------------------------------------------------------------
  # Web sidecar — api + front share this namespace
  # -------------------------------------------------------------------

  ts-funkwhale-web:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${FUNKWHALE_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:funkwhale-web
      TS_HOSTNAME: ${FUNKWHALE_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # containerboot (PID 1) never reaps: orphans from the healthcheck or a
    # `docker exec` would zombie forever. tini reaps; SIGTERM still forwards.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Django/Gunicorn ASGI. server.sh runs migrate + collectstatic before
  # starting gunicorn — generous start_period covers first-boot migrations.
  # Binds to 0.0.0.0:5000 inside this netns. Tailnet-side, port 5000 is
  # gated by ACL to autogroup:admin only; the netns' compose-bridge side is
  # reachable only from the host / same-project containers (SECURITY.md §1.1).
  api:
    image: funkwhale/api:${FUNKWHALE_VERSION:-1.3.4}
    network_mode: "service:ts-funkwhale-web"
    environment:
      <<: *api-env
    volumes:
      - funkwhale-media:/srv/funkwhale/data/media
      - funkwhale-static:/srv/funkwhale/data/static
      - funkwhale-music:/music:ro
    healthcheck:
      # Use Python (guaranteed in this image) so there are no shell variable
      # escaping issues. Catches HTTPError (401/403) as healthy; only fails
      # on URLError (connection refused / timeout) meaning gunicorn is down.
      test: ["CMD", "/venv/bin/python", "-c",
             "import urllib.request,urllib.error,sys\ntry:\n urllib.request.urlopen('http://127.0.0.1:5000/api/v1/instance/',timeout=5)\nexcept urllib.error.HTTPError:\n pass\nexcept:\n sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      ts-funkwhale-web:
        condition: service_healthy
    restart: unless-stopped

  # Nginx frontend — serves the Vue SPA, static assets, and media via
  # X-Accel-Redirect; proxies /api/, /federation/, /.well-known/ to
  # api on 127.0.0.1:5000 (shared network namespace).
  # Host nginx terminates TLS and proxies to this container on port 80.
  front:
    image: funkwhale/front:${FUNKWHALE_VERSION:-1.3.4}
    network_mode: "service:ts-funkwhale-web"
    environment:
      <<: *api-env
      FUNKWHALE_API_IP: "127.0.0.1"
      FUNKWHALE_API_PORT: "5000"
      NGINX_MAX_BODY_SIZE: 100M
    volumes:
      # Patches `server api:5000` -> `server 127.0.0.1:5000` after envsubst.
      # Runs as part of nginx's /docker-entrypoint.d/ sequence (99 = last).
      - ./fix-nginx-upstream.sh:/docker-entrypoint.d/99-fix-upstream.sh:ro
      # media: api writes here; front serves it via X-Accel-Redirect
      - funkwhale-media:/srv/funkwhale/data/media:ro
      # static: api's collectstatic writes here; front mounts at nginx path
      - funkwhale-static:/usr/share/nginx/html/staticfiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      ts-funkwhale-web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Worker sidecar — celeryworker + celerybeat share this namespace
  # -------------------------------------------------------------------

  ts-funkwhale-worker:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${FUNKWHALE_WORKER_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:funkwhale-worker
      TS_HOSTNAME: ${FUNKWHALE_WORKER_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # containerboot (PID 1) never reaps: orphans from the healthcheck or a
    # `docker exec` would zombie forever. tini reaps; SIGTERM still forwards.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # C_FORCE_ROOT allows Celery to run as root (required when sharing the
  # sidecar namespace, which runs as root).
  celeryworker:
    image: funkwhale/api:${FUNKWHALE_VERSION:-1.3.4}
    network_mode: "service:ts-funkwhale-worker"
    command: ["celery", "-A", "funkwhale_api.taskapp", "worker", "-l", "info", "--concurrency=0"]
    # The image has no ENTRYPOINT, so PID 1 is `celery worker` itself — not an
    # init, and it never reaps. The healthcheck below is a pipeline: it forks a
    # `ps` + `grep` pair on every run, and if one is killed mid-run the pair is
    # reparented to PID 1 and zombies permanently. tini reaps them.
    init: true
    environment:
      <<: *api-env
      C_FORCE_ROOT: "true"
    volumes:
      - funkwhale-media:/srv/funkwhale/data/media
      - funkwhale-music:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]elery'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      ts-funkwhale-worker:
        condition: service_healthy
    restart: unless-stopped

  celerybeat:
    image: funkwhale/api:${FUNKWHALE_VERSION:-1.3.4}
    network_mode: "service:ts-funkwhale-worker"
    command: ["celery", "-A", "funkwhale_api.taskapp", "beat", "-l", "info"]
    # Same reaping problem as `celeryworker` above: PID 1 is `celery beat`, a
    # plain scheduler, and the healthcheck forks a `ps`/`grep` pair per run.
    init: true
    environment:
      <<: *api-env
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[c]elery'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      ts-funkwhale-worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  funkwhale-media:
  funkwhale-static:
  funkwhale-music:
