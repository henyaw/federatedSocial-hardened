# Mastodon — three services, three Tailscale sidecars (each gets its own
# tailnet identity for fine-grained ACL):
#
#   ts-mastodon-web        → Rails web (puma), public-facing via host nginx
#   ts-mastodon-streaming  → Node streaming server, public-facing via host nginx
#   ts-mastodon-sidekiq    → background jobs, internal-only
#
# All three reach the same shared Postgres + Redis via MagicDNS.
#
# Bring up shared-db/ first. Generate the secrets in .env.example before
# first boot — Mastodon refuses to start without SECRET_KEY_BASE etc.
#
# First-boot note: the web container runs `db:migrate` on every start (safe
# — Rails skips already-applied migrations). On the very first start it
# also runs `db:setup` if the database is empty.

name: federated-mastodon

# YAML anchor for the env vars every Mastodon container needs. Centralizes
# changes and avoids 60-line repetition across web/streaming/sidekiq.
x-mastodon-env: &mastodon-env
  RAILS_ENV: production
  NODE_ENV: production
  LOCAL_DOMAIN: ${MASTODON_DOMAIN}
  WEB_DOMAIN: ${MASTODON_DOMAIN}

  DB_HOST: ${DB_MAGIC_NAME}.${TS_TAILNET}
  DB_PORT: "5432"
  DB_NAME: ${MASTODON_DB_NAME}
  DB_USER: ${MASTODON_DB_USER}
  DB_PASS: ${MASTODON_DB_PASSWORD}

  REDIS_HOST: ${REDIS_MAGIC_NAME}.${TS_TAILNET}
  REDIS_PORT: "6379"
  # Shared password for the main Redis instance (default user). Authelia's
  # session store lives on a separate instance this password cannot reach.
  REDIS_PASSWORD: ${REDIS_APPS_PASSWORD}

  SECRET_KEY_BASE: ${MASTODON_SECRET_KEY_BASE}
  OTP_SECRET: ${MASTODON_OTP_SECRET}
  VAPID_PRIVATE_KEY: ${MASTODON_VAPID_PRIVATE_KEY}
  VAPID_PUBLIC_KEY: ${MASTODON_VAPID_PUBLIC_KEY}

  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${MASTODON_AR_ENC_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${MASTODON_AR_ENC_KEY_DERIVATION_SALT}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${MASTODON_AR_ENC_PRIMARY_KEY}

  # SMTP host/port/login/password come from the shared SMTP_* relay in .env;
  # only the sender address is Mastodon-specific.
  SMTP_SERVER: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_LOGIN: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM_ADDRESS: ${MASTODON_SMTP_FROM_ADDRESS}
  SMTP_AUTH_METHOD: plain
  SMTP_OPENSSL_VERIFY_MODE: peer

  # ---- Object storage (S3 via Garage) — opt in ----
  # Set MASTODON_S3_ENABLED=true in .env to store media in Garage instead of
  # the local mastodon-public-system volume.
  S3_ENABLED: ${MASTODON_S3_ENABLED:-false}
  S3_BUCKET: ${MASTODON_S3_BUCKET:-mastodon-media}
  S3_REGION: ${GARAGE_REGION:-garage}
  # Inline MagicDNS — Compose does not expand vars inside vars.
  # GARAGE_S3_ENDPOINT_NAME defaults to the single node; point it at the
  # reverse-proxy host for the HA S3 load-balancer (README "Highly available
  # S3 endpoint").
  S3_ENDPOINT: http://${GARAGE_S3_ENDPOINT_NAME:-garage}.${TS_TAILNET}:3900
  S3_PROTOCOL: http
  # Garage uses path-style S3 API (bucket/key, not bucket.endpoint/key).
  S3_FORCE_SINGLE_REQUEST: "true"
  # Per-app Garage key (printed by provision-garage) — scoped to the
  # mastodon-media bucket only.
  AWS_ACCESS_KEY_ID: ${MASTODON_GARAGE_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${MASTODON_GARAGE_KEY_SECRET:-}
  # Optional CDN hostname for public media URLs. Leave blank to use the
  # Garage tailnet endpoint directly (fine for private/small instances).
  S3_ALIAS_HOST: ${MASTODON_S3_ALIAS_HOST:-}

  # Trust the Tailscale CGNAT range so RemoteIp middleware sees the real
  # client IP from X-Forwarded-For rather than the tailnet hop address.
  TRUSTED_PROXY_IP: "100.64.0.0/10"

  # ---- SSO via OIDC (bundled omniauth_openid_connect) — opt in ----
  # Set MASTODON_OIDC_ENABLED=true in .env to add a "Sign in with <name>"
  # button backed by Authelia. The matching Authelia client (id "mastodon")
  # and its redirect_uri are rendered by bootstrap.sh from authelia/
  # configuration.yml — keep MASTODON_OIDC_CLIENT_SECRET in sync (Mastodon
  # holds the plaintext; Authelia stores its pbkdf2 hash).
  OIDC_ENABLED: ${MASTODON_OIDC_ENABLED:-false}
  OIDC_DISPLAY_NAME: ${MASTODON_OIDC_DISPLAY_NAME:-Single Sign-On}
  OIDC_ISSUER: ${MASTODON_OIDC_ISSUER:-}
  # Discovery pulls auth/token/userinfo/jwks endpoints from the issuer's
  # /.well-known/openid-configuration — no need to list them individually.
  OIDC_DISCOVERY: "true"
  OIDC_SCOPE: "openid,profile,email"
  # The OIDC claim used as the stable external user id. preferred_username
  # mirrors the Authelia login name; switch to "sub" if usernames may change.
  OIDC_UID_FIELD: ${MASTODON_OIDC_UID_FIELD:-preferred_username}
  OIDC_CLIENT_ID: ${MASTODON_OIDC_CLIENT_ID:-mastodon}
  OIDC_CLIENT_SECRET: ${MASTODON_OIDC_CLIENT_SECRET:-}
  # Inline domain — Compose does not expand vars inside vars.
  OIDC_REDIRECT_URI: https://${MASTODON_DOMAIN}/auth/auth/openid_connect/callback
  # Authelia asserts email_verified; trust it so new SSO users skip the
  # "confirm your email" step (they have no password to reset anyway).
  OIDC_SECURITY_ASSUME_EMAIL_IS_VERIFIED: "true"

services:

  # ---------------------------------------------------------------------
  # Web — Rails (Puma). Public-facing.
  # ---------------------------------------------------------------------

  ts-mastodon-web:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${MASTODON_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-web
      TS_HOSTNAME: ${MASTODON_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION:-v4.5.11}
    network_mode: "service:ts-mastodon-web"
    # db:migrate is idempotent — Rails skips already-applied migrations.
    # db:seed is idempotent — creates built-in roles (Owner/Admin/Moderator)
    # on first boot; no-ops on subsequent boots. Required before tootctl
    # accounts create --role Owner, which fails if the roles table is empty.
    command:
      - sh
      - -c
      - |
        bundle exec rails db:migrate &&
        bundle exec rails db:seed &&
        exec bundle exec puma -C config/puma.rb
    environment:
      <<: *mastodon-env
    volumes:
      - mastodon-public-system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      ts-mastodon-web:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Streaming — Node.js. Public-facing via host nginx (different upstream
  # path; usually proxied at /api/v1/streaming).
  # ---------------------------------------------------------------------

  ts-mastodon-streaming:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${MASTODON_STREAMING_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-streaming
      TS_HOSTNAME: ${MASTODON_STREAMING_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:${MASTODON_VERSION:-v4.5.11}
    network_mode: "service:ts-mastodon-streaming"
    environment:
      <<: *mastodon-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/streaming/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      ts-mastodon-streaming:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Sidekiq — background workers. Internal-only.
  # ---------------------------------------------------------------------

  ts-mastodon-sidekiq:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${MASTODON_SIDEKIQ_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:mastodon-sidekiq
      TS_HOSTNAME: ${MASTODON_SIDEKIQ_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  sidekiq:
    image: ghcr.io/mastodon/mastodon:${MASTODON_VERSION:-v4.5.11}
    network_mode: "service:ts-mastodon-sidekiq"
    command: ["bundle", "exec", "sidekiq"]
    environment:
      <<: *mastodon-env
    volumes:
      - mastodon-public-system:/mastodon/public/system
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]idekiq'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      ts-mastodon-sidekiq:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mastodon-public-system:
