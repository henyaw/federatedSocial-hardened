# Pixelfed — three containers behind two Tailscale sidecars.
#
#   ts-pixelfed-web      → web (nginx+php-fpm), public-facing via host nginx
#   ts-pixelfed-worker   → worker (Horizon) + cron (schedule:work), internal-only
#
# Worker and cron share the worker sidecar's network namespace because both
# are internal-only (only need to reach Postgres+Redis) and benefit from
# being one tailnet device with one ACL tag.
#
# Bring up shared-db/ first and wait for both DB sidecars to be healthy
# in your Tailscale admin console before `docker compose up -d` here.

name: federated-pixelfed

# Shared env for all Pixelfed containers. Each service merges this anchor
# with <<: *pixelfed-env and adds its own DOCKER_SERVICE_NAME.
x-pixelfed-env: &pixelfed-env
  TZ: "UTC"
  APP_DOMAIN: ${PIXELFED_DOMAIN}
  APP_KEY: ${PIXELFED_APP_KEY}
  DB_HOST: ${DB_MAGIC_NAME}.${TS_TAILNET}
  DB_PORT: "5432"
  DB_DATABASE: ${PIXELFED_DB_NAME}
  DB_USERNAME: ${PIXELFED_DB_USER}
  DB_PASSWORD: ${PIXELFED_DB_PASSWORD}
  REDIS_HOST: ${REDIS_MAGIC_NAME}.${TS_TAILNET}
  REDIS_PORT: "6379"
  # Shared password for the main Redis instance. Pixelfed keeps its default
  # logical DBs (0 cache/queue, 1 session, 2 pulse) — all on this instance.
  REDIS_PASSWORD: ${REDIS_APPS_PASSWORD}
  # ---- Instance identity ----
  APP_NAME: ${PIXELFED_APP_NAME:-Pixelfed}
  APP_TIMEZONE: ${PIXELFED_TIMEZONE:-UTC}
  APP_LOCALE: ${PIXELFED_LOCALE:-en}
  # Admin domain — leave blank to use APP_DOMAIN.
  ADMIN_DOMAIN: ${PIXELFED_ADMIN_DOMAIN:-}
  INSTANCE_DESCRIPTION: ${PIXELFED_INSTANCE_DESCRIPTION:-}
  INSTANCE_CONTACT_EMAIL: ${PIXELFED_CONTACT_EMAIL:-}
  INSTANCE_CONTACT_FORM: ${PIXELFED_CONTACT_FORM:-false}
  # 100.64.0.0/10 covers all Tailscale CGNAT addresses (every sidecar hop).
  TRUST_PROXIES: ${PIXELFED_TRUST_PROXIES:-100.64.0.0/10}
  # ---- Registration ----
  OPEN_REGISTRATION: ${PIXELFED_OPEN_REGISTRATION:-false}
  ENFORCE_EMAIL_VERIFICATION: ${PIXELFED_ENFORCE_EMAIL_VERIFICATION:-false}
  # Curated onboarding — requires admin approval before accounts are activated.
  INSTANCE_CUR_REG: ${PIXELFED_CUR_REG:-false}
  # ---- Federation ----
  ACTIVITY_PUB: ${PIXELFED_ACTIVITY_PUB:-true}
  AP_REMOTE_FOLLOW: ${PIXELFED_AP_REMOTE_FOLLOW:-true}
  AP_SHAREDINBOX: ${PIXELFED_AP_SHAREDINBOX:-true}
  AP_INBOX: ${PIXELFED_AP_INBOX:-true}
  AP_OUTBOX: ${PIXELFED_AP_OUTBOX:-true}
  APP_FALLBACK_LOCALE: ${PIXELFED_FALLBACK_LOCALE:-en}
  ATOM_FEEDS: ${PIXELFED_ATOM_FEEDS:-true}
  NODEINFO: ${PIXELFED_NODEINFO:-true}
  WEBFINGER: ${PIXELFED_WEBFINGER:-true}
  # ---- Moderation ----
  INSTANCE_REPORTS_EMAIL_ENABLED: ${PIXELFED_REPORTS_EMAIL_ENABLED:-false}
  INSTANCE_REPORTS_EMAIL_ADDRESSES: ${PIXELFED_REPORTS_EMAIL_ADDRESSES:-}
  INSTANCE_REPORTS_EMAIL_AUTOSPAM: ${PIXELFED_REPORTS_EMAIL_AUTOSPAM:-false}
  # ---- Content ----
  STORIES_ENABLED: ${PIXELFED_STORIES_ENABLED:-false}
  PF_HIDE_NSFW_ON_PUBLIC_FEEDS: ${PIXELFED_HIDE_NSFW:-false}
  # ---- Email ----
  # Driver defaults to 'log' (mail written to the Laravel log, no relay).
  # Set PIXELFED_MAIL_DRIVER=smtp in .env once the shared SMTP_* relay is
  # configured. Host/port/user/password come from the shared block; only the
  # sender address and (TLS/SSL) encryption are Pixelfed-specific.
  MAIL_DRIVER: ${PIXELFED_MAIL_DRIVER:-log}
  MAIL_HOST: ${SMTP_HOST:-}
  MAIL_PORT: ${SMTP_PORT:-587}
  MAIL_USERNAME: ${SMTP_USER:-}
  MAIL_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_ENCRYPTION: ${PIXELFED_MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${PIXELFED_MAIL_FROM_ADDRESS:-noreply@${PIXELFED_DOMAIN}}
  MAIL_FROM_NAME: ${SMTP_FROM_NAME:-Pixelfed}
  # ---- Object storage (S3 via Garage) — opt in ----
  # Set PIXELFED_ENABLE_CLOUD=true in .env to store uploads in Garage instead
  # of the local pixelfed-storage volume. Requires the per-app Garage key
  # (PIXELFED_GARAGE_KEY_ID/SECRET, printed by provision-garage) — it can
  # reach ONLY the pixelfed-media bucket. AWS_USE_PATH_STYLE_ENDPOINT is
  # required — Garage uses path-style API (http://endpoint/bucket/key).
  PF_ENABLE_CLOUD: ${PIXELFED_ENABLE_CLOUD:-false}
  FILESYSTEM_CLOUD: s3
  PF_LOCAL_AVATAR_TO_CLOUD: ${PIXELFED_LOCAL_AVATAR_TO_CLOUD:-false}
  MEDIA_DELETE_LOCAL_AFTER_CLOUD: ${PIXELFED_DELETE_LOCAL_AFTER_CLOUD:-false}
  AWS_ACCESS_KEY_ID: ${PIXELFED_GARAGE_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${PIXELFED_GARAGE_KEY_SECRET:-}
  AWS_DEFAULT_REGION: ${GARAGE_REGION:-garage}
  AWS_BUCKET: ${PIXELFED_S3_BUCKET:-pixelfed-media}
  # Inline MagicDNS — Compose does not expand vars inside vars.
  # S3 API endpoint. GARAGE_S3_ENDPOINT_NAME defaults to the single Garage
  # node ("garage"); for a multi-node cluster set it to the reverse-proxy
  # host's MagicDNS name to reach the HA load-balancer (README "Highly
  # available S3 endpoint").
  AWS_ENDPOINT: http://${GARAGE_S3_ENDPOINT_NAME:-garage}.${TS_TAILNET}:3900
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  # Optional CDN URL for public media. Leave blank = use Garage endpoint.
  AWS_URL: ${PIXELFED_S3_URL:-}

services:

  # ---------------------------------------------------------------------
  # Web — public-facing
  # ---------------------------------------------------------------------

  ts-pixelfed-web:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${PIXELFED_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:pixelfed-web
      TS_HOSTNAME: ${PIXELFED_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # containerboot (PID 1) never reaps: orphans from the healthcheck or a
    # `docker exec` would zombie forever. tini reaps; SIGTERM still forwards.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/pixelfed-glitch/pixelfed:nginx-${PIXELFED_VERSION:-8.4-0.12.6-glitch.1.12.1}
    network_mode: "service:ts-pixelfed-web"
    entrypoint: ["/usr/local/bin/ts-entrypoint.sh"]
    command: ["forego", "start", "-r"]
    environment:
      <<: *pixelfed-env
      DOCKER_SERVICE_NAME: "web"
    volumes:
      - ./entrypoint-wrapper.sh:/usr/local/bin/ts-entrypoint.sh:ro
      - pixelfed-storage:/var/www/storage
      - pixelfed-cache:/var/www/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "curl --header 'Host: ${PIXELFED_DOMAIN}' --fail http://localhost/api/service/health-check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      ts-pixelfed-web:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Worker (Horizon) + cron — internal only, share one sidecar
  # ---------------------------------------------------------------------

  ts-pixelfed-worker:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${PIXELFED_WORKER_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:pixelfed-worker
      TS_HOSTNAME: ${PIXELFED_WORKER_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # containerboot (PID 1) never reaps: orphans from the healthcheck or a
    # `docker exec` would zombie forever. tini reaps; SIGTERM still forwards.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ghcr.io/pixelfed-glitch/pixelfed:fpm-${PIXELFED_VERSION:-8.4-0.12.6-glitch.1.12.1}
    network_mode: "service:ts-pixelfed-worker"
    entrypoint: ["/usr/local/bin/ts-entrypoint.sh"]
    command: ["gosu", "www-data", "php", "artisan", "horizon"]
    stop_signal: SIGTERM
    # PID 1 here is `php artisan horizon`, which is not an init and never reaps.
    # If the healthcheck below is killed mid-run, its forked `php` + `grep` pair
    # is reparented to PID 1 and lingers as a zombie permanently — an unbounded
    # PID leak. tini reaps them and still forwards SIGTERM to Horizon.
    init: true
    environment:
      <<: *pixelfed-env
      DOCKER_SERVICE_NAME: "worker"
      ENTRYPOINT_SKIP_SCRIPTS: "any"
    volumes:
      - ./entrypoint-wrapper.sh:/usr/local/bin/ts-entrypoint.sh:ro
      - pixelfed-storage:/var/www/storage
      - pixelfed-cache:/var/www/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "gosu www-data php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      ts-pixelfed-worker:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  cron:
    image: ghcr.io/pixelfed-glitch/pixelfed:fpm-${PIXELFED_VERSION:-8.4-0.12.6-glitch.1.12.1}
    network_mode: "service:ts-pixelfed-worker"
    entrypoint: ["/usr/local/bin/ts-entrypoint.sh"]
    command: ["gosu", "www-data", "php", "artisan", "schedule:work"]
    stop_signal: SIGTERM
    # Same reaping problem as `worker` above: PID 1 is `php artisan schedule:work`,
    # and the healthcheck below forks a `ps`/`grep` pair on every run.
    init: true
    environment:
      <<: *pixelfed-env
      DOCKER_SERVICE_NAME: "cron"
      ENTRYPOINT_SKIP_SCRIPTS: "any"
    volumes:
      - ./entrypoint-wrapper.sh:/usr/local/bin/ts-entrypoint.sh:ro
      - pixelfed-storage:/var/www/storage
      - pixelfed-cache:/var/www/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]chedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      ts-pixelfed-worker:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pixelfed-storage:
  pixelfed-cache:
