# Lemmy — federated link aggregator / community discussion board.
#
# Four containers share the ts-lemmy-web network namespace:
#   proxy     — nginx that routes public traffic to lemmy, lemmy-ui, and pictrs
#   lemmy     — Rust backend API (port 8536)
#   lemmy-ui  — SSR frontend (port 1234)
#   pictrs    — image hosting service (port 8080)
#
# All internal traffic stays on localhost (shared netns). The reverse proxy
# reaches the stack on port 80 (the nginx aggregator). Lemmy has no Redis
# dependency — Postgres only.
#
# FIRST BOOT:
#   1. ./bootstrap.sh provision-db lemmy   # creates user/db in postgres
#   2. ./bootstrap.sh up lemmy             # generates lemmy.runtime.hjson, brings up stack
#   3. First visit to the public URL prompts you to create the admin account.
#
# Pin LEMMY_VERSION in .env — backend (dessalines/lemmy) and UI
# (dessalines/lemmy-ui) must be the SAME tag or the API breaks.

name: federated-lemmy

services:

  ts-lemmy-web:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${LEMMY_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:lemmy-web
      TS_HOSTNAME: ${LEMMY_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # containerboot (PID 1) never reaps: orphans from the healthcheck or a
    # `docker exec` would zombie forever. tini reaps; SIGTERM still forwards.
    init: true
    healthcheck:
      # Lemmy has no Redis dependency — gate on Postgres only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  proxy:
    # nginx aggregator — routes /, /api, /pictrs, /feeds, etc. to the
    # correct backend on localhost. The reverse proxy on the host reaches
    # this container on port 80. See nginx.conf for routing details.
    image: nginx:1.31-alpine
    network_mode: "service:ts-lemmy-web"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  lemmy:
    # Pin LEMMY_VERSION in .env — must match lemmy-ui exactly.
    image: dessalines/lemmy:${LEMMY_VERSION:-0.19.5}
    network_mode: "service:ts-lemmy-web"
    environment:
      RUST_LOG: warn
    volumes:
      # Generated by `./bootstrap.sh up lemmy` from lemmy.hjson template.
      # Gitignored — edit lemmy.hjson (the tracked template), not this file.
      - ./lemmy.runtime.hjson:/config/config.hjson:ro
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  lemmy-ui:
    # Must match LEMMY_VERSION above exactly.
    image: dessalines/lemmy-ui:${LEMMY_VERSION:-0.19.5}
    network_mode: "service:ts-lemmy-web"
    environment:
      # All containers share ts-lemmy-web's netns, so lemmy backend is on
      # localhost:8536. The external host is used for SSR metadata generation.
      LEMMY_UI_LEMMY_INTERNAL_HOST: "localhost:8536"
      # External host is a BARE hostname (no scheme) — the scheme comes from
      # LEMMY_UI_HTTPS. A "https://" prefix here produces malformed
      # "https://https://..." URLs in server-rendered output.
      LEMMY_UI_LEMMY_EXTERNAL_HOST: "${LEMMY_DOMAIN}"
      # MUST be false: TLS terminates at the host Caddy, so the backend is
      # reachable only over plain HTTP internally. lemmy-ui's SSR builds its
      # backend URL as http{s}://INTERNAL_HOST from this flag — setting it true
      # makes SSR dial https://localhost:8536 and fail (the backend speaks HTTP
      # on the socket; Lemmy's own tls_enabled only affects generated URLs).
      # The browser still gets correct https links via window.location, and
      # federation URLs come from lemmy.hjson tls_enabled: true.
      LEMMY_UI_HTTPS: "false"
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

  pictrs:
    # pict-rs: image hosting service. Lemmy proxies /pictrs/* requests here.
    # PICTRS__SERVER__API_KEY must match pictrs.api_key in lemmy.runtime.hjson.
    image: asonix/pictrs:0.5.23
    network_mode: "service:ts-lemmy-web"
    environment:
      PICTRS__SERVER__API_KEY: ${LEMMY_PICTRS_API_KEY}
      # ---- Object storage (S3 via Garage) — opt in ----
      # Default 'filesystem' keeps images on the pictrs-data volume. Set
      # LEMMY_PICTRS_STORE=object_storage in .env to store them in Garage. The
      # bucket is PRIVATE — Lemmy proxies images through pict-rs (/pictrs/*),
      # so no public media host is needed (unlike the other apps). The bucket
      # must exist first: provision-garage creates 'lemmy-pictrs'. Credentials
      # are the per-app Garage key (scoped to lemmy-pictrs only).
      # use_path_style is required for Garage.
      PICTRS__STORE__TYPE: ${LEMMY_PICTRS_STORE:-filesystem}
      # GARAGE_S3_ENDPOINT_NAME defaults to the single node; point it at the
      # reverse-proxy host for the HA S3 load-balancer (README "Highly
      # available S3 endpoint").
      PICTRS__STORE__ENDPOINT: http://${GARAGE_S3_ENDPOINT_NAME:-garage}.${TS_TAILNET}:3900
      PICTRS__STORE__BUCKET_NAME: ${LEMMY_PICTRS_S3_BUCKET:-lemmy-pictrs}
      PICTRS__STORE__REGION: ${GARAGE_REGION:-garage}
      PICTRS__STORE__USE_PATH_STYLE: "true"
      PICTRS__STORE__ACCESS_KEY: ${LEMMY_GARAGE_KEY_ID:-}
      PICTRS__STORE__SECRET_KEY: ${LEMMY_GARAGE_KEY_SECRET:-}
    volumes:
      # Single volume at /mnt — pict-rs keeps BOTH its sled metadata repo
      # (/mnt/sled-repo) AND the actual image files (/mnt/files) under /mnt.
      # Mounting only /mnt/sled-repo would orphan the image files on the
      # container's ephemeral layer and lose every upload on recreate.
      - pictrs-data:/mnt
    depends_on:
      ts-lemmy-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pictrs-data:
