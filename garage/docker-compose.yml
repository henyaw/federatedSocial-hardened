# Garage — distributed S3-compatible object storage.
#
# All app stacks in this repo can store media here instead of local volumes,
# making instances portable across servers and load-balancer-friendly.
#
# This one compose file runs a SINGLE Garage node — one per host. A cluster
# is N hosts each running this file, joined over the tailnet. Which mode you
# get is driven entirely by .env (nothing here changes):
#
#   SINGLE NODE (default): GARAGE_REPLICATION_FACTOR unset/1.
#     ./bootstrap.sh up garage      # brings up + auto-provisions
#
#   THREE-NODE CLUSTER: GARAGE_REPLICATION_FACTOR=3, per-host GARAGE_MAGIC_NAME
#   and GARAGE_ZONE, shared GARAGE_RPC_SECRET, and a shared GARAGE_BOOTSTRAP_PEERS
#   assembled after first boot. Bring-up (see README "Multi-node Garage cluster"):
#     1. On EACH host:  ./bootstrap.sh up garage         # boots the node
#     2. On EACH host:  ./bootstrap.sh garage-peer-id    # collect the 3 ids
#     3. Set GARAGE_BOOTSTRAP_PEERS (all 3, comma-joined) in every host's .env
#     4. On EACH host:  ./bootstrap.sh up garage         # reboots with peers
#     5. ONCE, any host: ./bootstrap.sh provision-garage # forms cluster + buckets/keys
#
# Bring up shared-db/ first, then garage/, then app stacks.
#
# provision-garage initialises the layout, creates all app buckets, creates
# one access key PER APP (each scoped to only its own buckets — SECURITY.md
# §5.7), and prints the <APP>_GARAGE_KEY_ID/SECRET pairs — paste those into
# .env, then bring up app stacks. Re-running is idempotent.

name: federated-garage

services:

  ts-garage:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${GARAGE_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:garage
      TS_HOSTNAME: ${GARAGE_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v1.0.1}
    network_mode: "service:ts-garage"
    environment:
      # Overrides the placeholder rpc_secret in garage.toml at runtime.
      # All nodes in the same cluster must share this value.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.runtime.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # Use the garage binary itself — the dxflrs image may not include wget,
      # and the S3 /health endpoint returns non-200 until the cluster is fully
      # initialized. 'garage node id' queries the admin API (127.0.0.1:3903)
      # and exits 0 as soon as the process is up and serving RPC.
      test: ["CMD", "/garage", "node", "id"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      ts-garage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # metadata: small, critical — Garage cluster state, bucket/key directory.
  garage-meta:
  # data: large — actual object bytes.
  garage-data:
