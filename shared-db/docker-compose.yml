# Shared Postgres + Redis for every app stack in this repo.
#
# Each data container shares a Tailscale sidecar's network namespace via
# network_mode: "service:ts-<role>". There are no `ports:` directives
# anywhere — the data services are reachable from the tailnet only, gated
# by ACL tags. (Precisely: the shared netns also carries the compose
# project's bridge interface for coordination-server egress, reachable
# from the host and same-project containers — parties the model already
# trusts. See SECURITY.md §1.1; pg_hba.conf closes that path for Postgres.)
#
# Bring this up FIRST. Wait for both sidecars to appear in your Tailscale
# admin console before starting any app stack.

name: federated-shared-db

services:

  # ---------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------

  ts-postgres:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    # This node's OWN MagicDNS name. Single-node: leave PG_NODE_MAGIC_NAME
    # unset so it defaults to "pgsql-prod" (== DB_MAGIC_NAME) and apps reach
    # Postgres directly. HA: each Postgres host sets its own PG_NODE_MAGIC_NAME
    # (e.g. pg-primary / pg-standby), and DB_MAGIC_NAME instead names the
    # pg-router sidecar that apps dial. See README "Postgres high availability".
    hostname: ${PG_NODE_MAGIC_NAME:-pgsql-prod}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:db-postgres
      TS_HOSTNAME: ${PG_NODE_MAGIC_NAME:-pgsql-prod}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      # 127.0.0.1 ONLY — this endpoint must not be reachable across the
      # tailnet. Compose uses it to wait for tailnet authentication.
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    # Bootstrap DNS before Tailscale's MagicDNS is active.
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    network_mode: "service:ts-postgres"
    # Postgres listens on all interfaces inside this netns — including the
    # compose bridge (eth0) the sidecar needs for coordination-server egress
    # (SECURITY.md §1.1). The mounted pg_hba.conf restricts TCP connections
    # to the tailnet CGNAT/ULA ranges plus loopback, so the bridge path is
    # rejected at the auth layer without touching iptables. Tailnet-side
    # access is gated by Tailscale ACLs (see acl.example.hujson).
    # pg-entrypoint.sh wraps the stock entrypoint: a no-op for a primary
    # (single-node behaviour unchanged), and a pg_basebackup clone for an
    # empty standby (PG_ROLE=standby). command is passed through to the stock
    # entrypoint unchanged.
    entrypoint: ["/usr/local/bin/pg-entrypoint.sh"]
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # HA replication (see README "Postgres high availability"). All default
      # to a single-node primary, so an unconfigured deployment is unchanged.
      PG_ROLE: ${PG_ROLE:-primary}
      PG_PRIMARY_MAGIC_NAME: ${PG_PRIMARY_MAGIC_NAME:-}
      TS_TAILNET: ${TS_TAILNET:-}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-}
      PG_REPLICATION_SLOT: ${PG_REPLICATION_SLOT:-standby_slot}
      # Surfaced to the init script so it can mint per-app users/dbs.
      PIXELFED_DB_NAME: ${PIXELFED_DB_NAME}
      PIXELFED_DB_USER: ${PIXELFED_DB_USER}
      PIXELFED_DB_PASSWORD: ${PIXELFED_DB_PASSWORD}
      MASTODON_DB_NAME: ${MASTODON_DB_NAME}
      MASTODON_DB_USER: ${MASTODON_DB_USER}
      MASTODON_DB_PASSWORD: ${MASTODON_DB_PASSWORD}
      DIASPORA_DB_NAME: ${DIASPORA_DB_NAME}
      DIASPORA_DB_USER: ${DIASPORA_DB_USER}
      DIASPORA_DB_PASSWORD: ${DIASPORA_DB_PASSWORD}
      FUNKWHALE_DB_NAME: ${FUNKWHALE_DB_NAME}
      FUNKWHALE_DB_USER: ${FUNKWHALE_DB_USER}
      FUNKWHALE_DB_PASSWORD: ${FUNKWHALE_DB_PASSWORD}
      GOTOSOCIAL_DB_NAME: ${GOTOSOCIAL_DB_NAME}
      GOTOSOCIAL_DB_USER: ${GOTOSOCIAL_DB_USER}
      GOTOSOCIAL_DB_PASSWORD: ${GOTOSOCIAL_DB_PASSWORD}
      PEERTUBE_DB_NAME: ${PEERTUBE_DB_NAME}
      PEERTUBE_DB_USER: ${PEERTUBE_DB_USER}
      PEERTUBE_DB_PASSWORD: ${PEERTUBE_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Tracked in git — static policy, no secrets. See the file's comments.
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # Standby-clone wrapper (no-op for a primary). Tracked, executable.
      - ./pg-entrypoint.sh:/usr/local/bin/pg-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      ts-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------

  ts-redis:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${REDIS_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:db-redis
      TS_HOSTNAME: ${REDIS_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # Main Redis — fediverse apps (logical DBs 0-2) and Stalwart (DB 3).
  # Password-authenticated (REDIS_APPS_PASSWORD). Authelia does NOT live
  # here: its session store runs in the separate redis-authelia instance
  # below, so a compromised fediverse app holding this password cannot
  # read or forge SSO session state (SECURITY.md §3.2 / §5.7).
  #
  # Why instance separation instead of Redis ACL users: ACL rules cannot
  # scope SELECT to a logical DB index, two apps in this stack (Pixelfed,
  # PeerTube) support password-only auth (no ACL usernames), and Pixelfed's
  # Predis client unconditionally SELECTs its session/pulse DBs on connect.
  # A second instance behind a port-scoped tailnet ACL grant is the boundary
  # Redis logical DBs never were.
  redis:
    image: redis:7-alpine
    network_mode: "service:ts-redis"
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Redis sees itself bound to 0.0.0.0 inside the shared netns; the
      # tailnet ACL plus the password below are the gates.
      - --protected-mode
      - "no"
      - --requirepass
      - ${REDIS_APPS_PASSWORD}
    environment:
      # Lets the healthcheck's redis-cli authenticate without leaking the
      # password into `docker inspect` healthcheck args or process lists.
      REDISCLI_AUTH: ${REDIS_APPS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      ts-redis:
        condition: service_healthy
    restart: unless-stopped

  # Authelia's dedicated Redis — SSO session store, its own password, on
  # its own port (6380). Shares the ts-redis sidecar netns, so it is the
  # same tailnet node; the ACL grants tag:authelia (and nothing else)
  # access to tcp/6380. Fediverse apps hold only REDIS_APPS_PASSWORD and
  # have no grant to this port.
  redis-authelia:
    image: redis:7-alpine
    network_mode: "service:ts-redis"
    command:
      - redis-server
      - --port
      - "6380"
      - --appendonly
      - "yes"
      - --protected-mode
      - "no"
      - --requirepass
      - ${REDIS_AUTHELIA_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_AUTHELIA_PASSWORD}
    volumes:
      - redis-authelia-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      ts-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  redis-authelia-data:
