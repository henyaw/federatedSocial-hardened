# pg_hba.conf — shared-db Postgres host-based auth policy (tracked in git).
#
# Why this file exists (SECURITY.md §1.1 / §5.7): the postgres container
# shares its sidecar's network namespace, which carries not just `lo` and
# `tailscale0` but also the compose project's bridge (eth0) that the sidecar
# needs to reach the Tailscale coordination server. Postgres binds 0.0.0.0,
# so without this file it would also answer on the bridge — reachable from
# the host and from same-project containers, bypassing every tailnet ACL.
#
# This policy accepts TCP connections ONLY from the Tailscale address ranges
# (plus loopback inside the netns), closing the bridge path at the auth
# layer with no iptables involved. Tailnet-side reachability is still gated
# by the ACL (acl.example.hujson); this is defense in depth behind it.
#
# Mounted via: postgres -c hba_file=/etc/postgresql/pg_hba.conf
# (see shared-db/docker-compose.yml).

# Local unix socket — used by the container healthcheck (pg_isready),
# bootstrap.sh's `docker exec ... psql`, initdb scripts, and pg-backup.sh.
# Trust matches the stock docker-entrypoint behaviour for the socket.
local   all   all                          trust

# Loopback inside the shared netns (sidecar tooling, debugging).
host    all   all   127.0.0.1/32           scram-sha-256
host    all   all   ::1/128                scram-sha-256

# Tailscale CGNAT range — every tailnet node's IPv4 address.
host    all   all   100.64.0.0/10          scram-sha-256

# Tailscale IPv6 ULA range — tailnet nodes may dial the AAAA record.
host    all   all   fd7a:115c:a1e0::/48    scram-sha-256

# Streaming replication (Postgres HA — see README "Postgres high
# availability"). The standby connects as the `replicator` role using the
# special "replication" pseudo-database. Same tailnet-only restriction as
# every other rule; the role's REPLICATION privilege + password
# (REPLICATION_PASSWORD in .env) is the gate. The role name is fixed here —
# keep REPLICATION_USER=replicator in .env, or edit both. Harmless on a
# single-node deployment (no role connects for replication).
host    replication   replicator   100.64.0.0/10          scram-sha-256
host    replication   replicator   fd7a:115c:a1e0::/48    scram-sha-256

# Anything else (notably the docker bridge subnet) matches no rule and is
# rejected. Do not add a `host all all all` catch-all — that would reopen
# the bridge path this file exists to close.
