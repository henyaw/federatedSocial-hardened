# Reference nginx stream-module snippet: HA load-balancer for the Garage
# S3 API across a multi-node cluster.
#
# WHY. Apps reach object storage at the S3 API (:3900). With a single node
# name in GARAGE_S3_ENDPOINT_NAME, that one node is an availability
# dependency for every upload/read (data is still replicated, but if that
# node is down the S3 path is down). This config fronts ALL cluster nodes
# with the host reverse proxy so app -> S3 traffic fails over automatically.
# Only needed for a multi-node cluster; a single node has nothing to balance.
#
# WHY LAYER 4 (TCP), NOT HTTP. S3 SigV4 signs the Host header and path. An
# HTTP proxy that rewrites either breaks the signature. A raw TCP proxy
# forwards the request byte-for-byte, so the node validates the exact request
# the app signed — no signature juggling, no per-app config. (Garage uses
# path-style addressing here, so the Host value is immaterial to routing; the
# node reads the bucket from the path.) The app's endpoint is THIS proxy's
# MagicDNS name, and it signs for that name; the node accepts it because the
# bytes are unchanged.
#
# Requirements:
#   - nginx built with --with-stream (Debian/Ubuntu: apt-get install
#     libnginx-mod-stream).
#   - The host machine has tag:reverse-proxy in the Tailscale admin console,
#     and the ACL grants tag:reverse-proxy -> tag:garage:3900 (upstream) and
#     <app tags> -> tag:reverse-proxy:3900 (apps reach this LB). Both are in
#     acl.example.hujson.
#   - .env: set GARAGE_S3_ENDPOINT_NAME to THIS host's MagicDNS name (the
#     reverse-proxy host), so apps target the LB instead of one node.
#
# Place OUTSIDE the http {} block (e.g. directly in nginx.conf, or in
# /etc/nginx/streams-enabled/garage-s3.conf if your distro splits streams
# from http) — same as nginx/sites-available/peertube-rtmp.conf.

stream {
    upstream garage_s3 {
        # One line per cluster node — MagicDNS names match each host's
        # GARAGE_MAGIC_NAME.TS_TAILNET. Plain round-robin; any node serves
        # any request and proxies internally to the node holding the data.
        #
        # max_fails/fail_timeout are passive health checks: after 2 failed
        # connects a node is taken out of rotation for 10s, then retried.
        # On a connect error nginx transparently tries the next node (stream
        # proxy_next_upstream is on by default), so a dead node is invisible
        # to the app.
        server garage-1.YOUR-TS-TAILNET:3900 max_fails=2 fail_timeout=10s;
        server garage-2.YOUR-TS-TAILNET:3900 max_fails=2 fail_timeout=10s;
        server garage-3.YOUR-TS-TAILNET:3900 max_fails=2 fail_timeout=10s;
    }

    server {
        # Listen on the tailnet only. Prefer binding this host's Tailscale IP
        # (100.x from `tailscale ip -4`) so :3900 is never offered on the
        # public interface. `listen 3900;` (all interfaces) also works because
        # the host firewall default-denies inbound :3900 and the tailnet side
        # is ACL-gated — but binding the tailnet IP is the tighter choice.
        #   listen 100.x.y.z:3900;
        listen 3900;

        proxy_pass            garage_s3;
        # S3 PUTs can be large and slow; keep the tunnel open. Short connect
        # timeout so failover to a healthy node is fast.
        proxy_connect_timeout 5s;
        proxy_timeout         1h;
        # Try up to 2 more nodes if the chosen one refuses/aborts the connect.
        proxy_next_upstream_tries 3;
    }
}

# ---------------------------------------------------------------------------
# Caddy equivalent (custom build with the caddy-l4 module — the one this repo
# already uses for the mail edge; see caddy/README.md). Add inside the single
# `layer4 { }` block in caddy/Caddyfile. Bind the tailnet IP so :3900 is not
# public. lb_policy round_robin + passive health via fail_duration mirrors the
# nginx behaviour above.
#
#   layer4 {
#     100.x.y.z:3900 {                     # this host's `tailscale ip -4`
#       route {
#         proxy {
#           upstream garage-1.YOUR-TS-TAILNET:3900
#           upstream garage-2.YOUR-TS-TAILNET:3900
#           upstream garage-3.YOUR-TS-TAILNET:3900
#           lb_policy round_robin
#           health_interval 10s
#           health_timeout 3s
#         }
#       }
#     }
#   }
