# Diaspora — single embedded container behind one Tailscale sidecar.
#
# Sidekiq runs inside the unicorn process via SERVER_EMBED_SIDEKIQ_WORKER=true
# (see config/diaspora.yml). For small-to-medium pods this is fine; if you
# outgrow it, split sidekiq into its own service + sidecar (tag:diaspora-
# sidekiq) and flip embed_sidekiq_worker to false.
#
# Bring up shared-db/ first.
#
# REQUIRED config files (checked into the repo — present after clone):
#   config/diaspora.toml  — pod settings; Diaspora 1.x will FATAL on startup
#                           without it ("Couldn't parse config/diaspora.toml!")
#   config/database.yml   — DB connection template (env vars substitute in)
#
# diaspora.yml is NOT mounted. When diaspora.toml is present, Diaspora ignores
# diaspora.yml and warns if both exist. toml is the supported format in 1.x.
#
# Do NOT delete these files. Dynamic values (URL, Redis, DB) are injected
# at runtime via the environment: block below; the files provide the static
# defaults that Diaspora requires to parse before env vars take effect.

name: federated-diaspora

services:

  ts-diaspora-web:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${DIASPORA_WEB_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:diaspora-web
      TS_HOSTNAME: ${DIASPORA_WEB_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    dns: [1.1.1.1, 1.0.0.1]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6379"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  diaspora:
    image: koehn/diaspora:${DIASPORA_VERSION:-0.9.1.0}
    network_mode: "service:ts-diaspora-web"
    environment:
      # Diaspora's settings reader maps these onto the YAML config tree
      # via the documented dotted-path → upper-snake-case rule.
      ENVIRONMENT_URL: ${DIASPORA_URL}
      # Password embedded in the URL — REDIS_APPS_PASSWORD must be URL-safe
      # (openssl rand -hex 32; see .env.example).
      ENVIRONMENT_REDIS: redis://:${REDIS_APPS_PASSWORD}@${REDIS_MAGIC_NAME}.${TS_TAILNET}:6379

      # Email — configuration.mail.* config keys mapped to env vars with the
      # same convention as ENVIRONMENT_* above (keep top-level section, dots
      # to underscores, uppercase). Host/port/user/password come from the
      # shared SMTP_* relay in .env; only the toggle + sender are per-app.
      # Diaspora leaves mail disabled when CONFIGURATION_MAIL_ENABLE=false.
      CONFIGURATION_MAIL_ENABLE: ${DIASPORA_MAIL_ENABLE:-false}
      CONFIGURATION_MAIL_SENDER_ADDRESS: ${DIASPORA_MAIL_SENDER_ADDRESS:-noreply@example.com}
      CONFIGURATION_MAIL_METHOD: smtp
      CONFIGURATION_MAIL_SMTP_HOST: ${SMTP_HOST:-}
      CONFIGURATION_MAIL_SMTP_PORT: ${SMTP_PORT:-587}
      CONFIGURATION_MAIL_SMTP_USERNAME: ${SMTP_USER:-}
      CONFIGURATION_MAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # "plain" auth + STARTTLS is correct for port 587. Set authentication
      # to "none" (and disable starttls) only for an unauthenticated relay.
      CONFIGURATION_MAIL_SMTP_AUTHENTICATION: plain
      CONFIGURATION_MAIL_SMTP_STARTTLS_AUTO: "true"

      # Postgres connection (read by config/database.yml's ERB).
      DIASPORA_DB_HOST: ${DB_MAGIC_NAME}.${TS_TAILNET}
      DIASPORA_DB_PORT: "5432"
      DIASPORA_DB_NAME: ${DIASPORA_DB_NAME}
      DIASPORA_DB_USER: ${DIASPORA_DB_USER}
      DIASPORA_DB_PASSWORD: ${DIASPORA_DB_PASSWORD}

      RAILS_ENV: production
      # Without a UTF-8 locale Ruby defaults to US-ASCII and citrus fails to
      # parse diaspora.toml if it contains any non-ASCII bytes.
      LANG: C.UTF-8
    volumes:
      - ./config/diaspora.toml:/home/diaspora/diaspora/config/diaspora.toml:ro
      - ./config/database.yml:/home/diaspora/diaspora/config/database.yml:ro
      - diaspora-uploads:/home/diaspora/diaspora/public/uploads
    healthcheck:
      # Diaspora returns 200 on / once the app server is up. Generous
      # start_period — first boot includes asset precompile + migrations.
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      ts-diaspora-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  diaspora-uploads:
