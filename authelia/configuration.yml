---
# Authelia configuration template.
#
# DO NOT edit this file to set your domain — set AUTHELIA_DOMAIN in .env.
# bootstrap.sh generates authelia/configuration.runtime.yml from this template
# (substituting __AUTHELIA_DOMAIN__) before bringing up the stack. The runtime
# file is gitignored; this template is what git tracks.
#
# The only things you DO need to edit here (when you're ready):
#   - OIDC clients: uncomment and fill in the client stubs at the bottom
#   - Access control rules: add per-app rules below the portal bypass
#
# Most runtime settings (database, Redis, SMTP, secrets) are injected via
# AUTHELIA_* env vars in docker-compose.yml. This file handles settings that
# Authelia v4.38+ cannot accept via environment variables:
#   - session.cookies (domain and authelia_url)
#   - access control rules
#   - OIDC JWKS key path and client list

# Log level. Change to debug when diagnosing OIDC issues.
log:
  level: info

# File-based user database. This file is operator-managed and gitignored.
# To add a user, generate a password hash and edit users.yml directly:
#
#   docker exec federated-authelia-authelia-1 \
#     authelia crypto hash generate argon2 --password 'yourpassword'
#
# Then add to users.yml:
#   users:
#     alice:
#       displayname: Alice
#       password: "$argon2id$..."  (the hash output above)
#       email: alice@example.com
#       groups: [admins, users]
authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2id
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32
      salt_length: 16

# Access control — default deny, then allow by app and group.
# Add rules here as you bring up OIDC-integrated apps.
access_control:
  default_policy: deny
  rules:
    # Authelia portal itself must always be accessible (populated from .env).
    - domain: "__AUTHELIA_DOMAIN__"
      policy: bypass

    # ---- Add per-app rules below ----
    # Example: require login for all GoToSocial paths
    # - domain: "gotosocial.example.com"
    #   policy: one_factor

    # Example: require two-factor for the Stalwart admin panel
    # - domain: "mail.example.com"
    #   policy: two_factor

# Session cookie configuration.
# session.cookies cannot be set via environment variables in Authelia v4.38+.
# Values are substituted from AUTHELIA_DOMAIN in .env by bootstrap.sh.
# Redis config is injected via AUTHELIA_SESSION_REDIS_* env vars.
session:
  cookies:
    - domain: "__AUTHELIA_DOMAIN__"
      authelia_url: "https://__AUTHELIA_DOMAIN__"

# Notifier — Authelia requires a notifier to send password reset and 2FA
# emails. The filesystem notifier is the safe default: it writes notification
# content to a file inside the container, viewable via:
#   docker exec federated-authelia-authelia-1 cat /tmp/authelia_notifications.txt
#
# To switch to SMTP: uncomment AUTHELIA_NOTIFIER_SMTP_* in docker-compose.yml.
# Do NOT set those vars when SMTP_HOST is blank — Authelia refuses to start.
notifier:
  filesystem:
    filename: /tmp/authelia_notifications.txt

# OIDC identity provider — sign ID tokens with an RSA key.
identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        # Authelia's jwks 'key' takes PEM CONTENT (not a path, not a _FILE env).
        # The template filter (X_AUTHELIA_CONFIG_FILTERS=template, set in
        # docker-compose.yml) inlines + indents /config/private.pem here at load
        # time, so the key stays gitignored and out of this tracked template.
        # Generate: openssl genrsa -out authelia/private.pem 4096
        key: {{ secret "/config/private.pem" | mindent 10 "|" | msquote }}

    # ---- Claims policies ----
    # Authelia 4.39+ no longer puts standard/extra claims (email, groups, name,
    # …) in the ID TOKEN by default — they're only exposed at the userinfo
    # endpoint. GoToSocial reads claims from the ID token, so without this it
    # gets an empty email and account creation fails with "mail: no address".
    # This policy injects the needed claims into the id_token for clients that
    # reference it via `claims_policy`.
    claims_policies:
      gotosocial:
        id_token: [email, email_verified, name, preferred_username, groups]
      mastodon:
        id_token: [email, email_verified, name, preferred_username, groups]
      peertube:
        id_token: [email, email_verified, name, preferred_username, groups]
      # hog:   # heart-of-gold Nuxt apps (console, babelfish). Only needed if the
      #        # app reads groups/email from the id_token rather than the userinfo
      #        # endpoint (nuxt-auth-utils usually uses userinfo, where Authelia
      #        # exposes these by default — try WITHOUT this first). Uncomment the
      #        # policy AND the `claims_policy: hog` line in the clients below if
      #        # the `admins` group doesn't come through.
      #   id_token: [email, email_verified, name, preferred_username, groups]

    # ---- OIDC clients ----
    # Register one client per app that integrates with Authelia.
    # client_id and client_secret are arbitrary strings; keep secrets long and
    # random. Redirect URIs must exactly match what the app sends in its auth
    # request — check the app's OIDC documentation for the correct path.
    #
    clients:

    # --- GoToSocial ---
    # GTS configures OIDC from env/flags ONLY (it has no OIDC admin UI) — see
    # gotosocial/docker-compose.yml GTS_OIDC_*. The two placeholders below are
    # rendered by bootstrap.sh into configuration.runtime.yml (gitignored):
    #   __GTS_OIDC_HASH__   <- pbkdf2 hash derived from GOTOSOCIAL_OIDC_CLIENT_SECRET
    #   __GOTOSOCIAL_URL__  <- GOTOSOCIAL_URL from .env
    # so no secret or real domain is ever committed; GTS holds the plaintext.
    # (When SSO is off, a throwaway hash is rendered so this stays a valid—but
    # unused—client, since Authelia requires at least one OIDC client.)
      - client_id: gotosocial
        client_name: GoToSocial
        client_secret: "__GTS_OIDC_HASH__"
        public: false
        authorization_policy: one_factor
        claims_policy: gotosocial
        redirect_uris:
          - https://__GOTOSOCIAL_URL__/auth/callback
        scopes: [openid, profile, email, groups]
        response_types: [code]

    # --- Mastodon ---
    # Mastodon integrates OIDC via its bundled omniauth_openid_connect (env
    # OIDC_* in mastodon/docker-compose.yml). The two placeholders below are
    # rendered by bootstrap.sh into configuration.runtime.yml (gitignored):
    #   __MASTODON_OIDC_HASH__  <- pbkdf2 hash derived from MASTODON_OIDC_CLIENT_SECRET
    #   __MASTODON_URL__        <- MASTODON_DOMAIN from .env
    # so no secret or real domain is ever committed; Mastodon holds the plaintext.
    # (When SSO is off, a throwaway hash is rendered so this stays a valid—but
    # unused—client, since Authelia requires at least one OIDC client.)
      - client_id: mastodon
        client_name: Mastodon
        client_secret: "__MASTODON_OIDC_HASH__"
        public: false
        authorization_policy: one_factor
        claims_policy: mastodon
        redirect_uris:
          - https://__MASTODON_URL__/auth/auth/openid_connect/callback
        scopes: [openid, profile, email]
        response_types: [code]

    # --- Funkwhale ---
    # Funkwhale has NO OpenID Connect / SSO support upstream — it can act as an
    # OAuth2 *provider* for apps, and supports LDAP, but cannot delegate login
    # to an external OIDC provider like Authelia (long-standing feature request,
    # not implemented through 1.x/2.0). So there is no Funkwhale client here;
    # the Funkwhale stack is S3-only. Revisit if upstream adds OIDC RP support.

    # --- PeerTube ---
    # OIDC via the peertube-plugin-auth-openid-connect plugin (configured in the
    # PeerTube admin UI with PEERTUBE_OIDC_CLIENT_ID/SECRET from .env). Rendered by
    # bootstrap.sh into configuration.runtime.yml (gitignored):
    #   __PEERTUBE_OIDC_HASH__ <- pbkdf2 hash of PEERTUBE_OIDC_CLIENT_SECRET
    #   __PEERTUBE_URL__       <- PEERTUBE_DOMAIN from .env
    # The plugin sends client creds in the POST body, so token_endpoint_auth_method
    # MUST be client_secret_post (Authelia defaults confidential clients to basic,
    # which fails the token exchange with "…does not allow this method").
      - client_id: peertube
        client_name: PeerTube
        client_secret: "__PEERTUBE_OIDC_HASH__"
        public: false
        authorization_policy: one_factor
        claims_policy: peertube
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://__PEERTUBE_URL__/plugins/auth-openid-connect/router/code-cb
        scopes: [openid, profile, email]
        response_types: [code]

    # --- Console (heart-of-gold operator dashboard) ---
    # Internal fleet dashboard; the app gates the whole thing on the `admins`
    # group (NUXT_AUTH_REQUIRED_GROUP=admins). nuxt-auth-utils (packages/auth) does
    # Authorization Code + PKCE and calls back at /auth/authelia. Rendered by
    # bootstrap.sh:
    #   __CONSOLE_OIDC_HASH__ <- pbkdf2 hash of CONSOLE_OIDC_CLIENT_SECRET
    #                            (mirror of apps/console/.env — keep in sync)
    #   __CONSOLE_URL__       <- CONSOLE_URL from .env
    # No access_control rule needed — like gotosocial/mastodon this is an OIDC
    # client; the app itself enforces the `admins` group. (If that group doesn't
    # arrive via userinfo, uncomment the `hog` claims-policy above and add
    # `claims_policy: hog` here.)
    # nuxt-auth-utils (packages/auth) sends the client secret in the token-
    # request body, so this MUST be client_secret_post. Authelia defaults
    # confidential clients to client_secret_basic, which fails the token
    # exchange with "…does not allow this method" and bounces the operator
    # to "Sign-in failed" — same trap as the peertube client above.
      - client_id: console
        client_name: Console
        client_secret: "__CONSOLE_OIDC_HASH__"
        public: false
        authorization_policy: one_factor
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://__CONSOLE_URL__/auth/authelia
        scopes: [openid, profile, email, groups]
        response_types: [code]

    # --- Babelfish (heart-of-gold public CMS) ---
    # Same handler (/auth/authelia). /admin requires a logged-in session; per-blog
    # ownership is enforced in-app, not by an Authelia group. Rendered by bootstrap:
    #   __BABELFISH_OIDC_HASH__ <- pbkdf2 hash of BABELFISH_OIDC_CLIENT_SECRET
    #                              (mirror of apps/babelfish/.env — keep in sync)
    #   __BABELFISH_URL__       <- BABELFISH_URL from .env
    # NOT wired yet: until BABELFISH_OIDC_CLIENT_SECRET is set in BOTH .env files,
    # bootstrap hashes a throwaway → this stays a valid-but-unused client.
    # Same nuxt-auth-utils handler as console — creds go in the POST body, so
    # this MUST be client_secret_post too.
      - client_id: babelfish
        client_name: Babelfish
        client_secret: "__BABELFISH_OIDC_HASH__"
        public: false
        authorization_policy: one_factor
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://__BABELFISH_URL__/auth/authelia
        scopes: [openid, profile, email, groups]
        response_types: [code]
