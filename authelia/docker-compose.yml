# Authelia — SSO / OIDC provider for GoToSocial, Mastodon, Funkwhale, PeerTube.
#
# The sidecar (ts-authelia) joins the tailnet tagged tag:authelia and gives
# Authelia its only network interface. The reverse proxy reaches Authelia on
# port 9091 via MagicDNS. App tiers that use OIDC also reach port 9091 to
# validate tokens.
#
# FIRST BOOT:
#   1. Generate the OIDC JWKS key (once, operator-kept):
#        openssl genrsa -out authelia/private.pem 4096
#   2. Create users.yml (operator-managed, gitignored):
#        See: ./bootstrap.sh user-create authelia
#   3. ./bootstrap.sh provision-db authelia   # creates user/db in postgres
#   4. ./bootstrap.sh up authelia             # brings up the stack
#   5. Register OIDC clients for each app in authelia/configuration.yml
#        (see the commented examples there) and restart the stack.
#
# Authelia maps AUTHELIA_* environment variables directly onto its configuration
# keys (overriding the YAML). Only settings that can't be expressed as env vars
# (OIDC JWKS key path, access control rules, OIDC client list) live in
# configuration.yml.

name: federated-authelia

services:

  ts-authelia:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.98.4}
    hostname: ${AUTHELIA_MAGIC_NAME}
    environment:
      TS_AUTHKEY: ${TS_OAUTH_CLIENT_SECRET}?ephemeral=true
      TS_EXTRA_ARGS: --advertise-tags=tag:authelia
      TS_HOSTNAME: ${AUTHELIA_MAGIC_NAME}
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz && nc -z -w3 ${DB_MAGIC_NAME}.${TS_TAILNET} 5432 && nc -z -w3 ${REDIS_MAGIC_NAME}.${TS_TAILNET} 6380"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  authelia:
    image: authelia/authelia:${AUTHELIA_VERSION:-4.39.20}
    network_mode: "service:ts-authelia"
    environment:
      # Authelia maps AUTHELIA_<SECTION>_<KEY> onto config keys directly.
      # Server — v4.38+ consolidated host+port into a single address string.
      AUTHELIA_SERVER_ADDRESS: "tcp://0.0.0.0:9091"
      # Postgres storage backend
      AUTHELIA_STORAGE_POSTGRES_HOST: ${DB_MAGIC_NAME}.${TS_TAILNET}
      AUTHELIA_STORAGE_POSTGRES_PORT: "5432"
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${AUTHELIA_DB_NAME:-authelia}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${AUTHELIA_DB_USER:-authelia}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD}
      # Redis session cache — Authelia's DEDICATED instance on port 6380
      # (shared-db/docker-compose.yml redis-authelia), with its own password.
      # Fediverse apps have neither this password nor an ACL grant to 6380,
      # so SSO session state is out of their reach (SECURITY.md §5.7).
      AUTHELIA_SESSION_REDIS_HOST: ${REDIS_MAGIC_NAME}.${TS_TAILNET}
      AUTHELIA_SESSION_REDIS_PORT: "6380"
      AUTHELIA_SESSION_REDIS_PASSWORD: ${REDIS_AUTHELIA_PASSWORD}
      AUTHELIA_SESSION_REDIS_DATABASE_INDEX: ${AUTHELIA_REDIS_DB:-4}
      # Secrets — all required before first boot.
      # NOTE: session.cookies domain is YAML-only (no env var equivalent in
      # Authelia v4.38+). Edit configuration.yml directly — see the comment there.
      #
      # AUTHELIA_JWT_SECRET was renamed in v4.38 to the long form below.
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_OIDC_HMAC_SECRET}
      # Enable Authelia's config template filter so configuration.yml can inline
      # the OIDC JWKS private key from /config/private.pem (see jwks[0].key there).
      X_AUTHELIA_CONFIG_FILTERS: template
      # SMTP notifier — ONLY uncomment these when SMTP_HOST is set in .env.
      # With a blank SMTP_HOST, Authelia refuses to start. When these are
      # commented out, configuration.yml's filesystem notifier is used instead
      # (notifications written to /tmp/authelia_notifications.txt in the container).
      # Compose cannot do nested variable defaults, so AUTHELIA_NOTIFIER_SMTP_SENDER
      # must be set explicitly in .env as AUTHELIA_MAIL_FROM (not derived inline).
      # AUTHELIA_NOTIFIER_SMTP_HOST: ${SMTP_HOST}
      # AUTHELIA_NOTIFIER_SMTP_PORT: ${SMTP_PORT:-587}
      # AUTHELIA_NOTIFIER_SMTP_USERNAME: ${SMTP_USER}
      # AUTHELIA_NOTIFIER_SMTP_PASSWORD: ${SMTP_PASSWORD}
      # AUTHELIA_NOTIFIER_SMTP_SENDER: ${AUTHELIA_MAIL_FROM}
    volumes:
      - ./configuration.runtime.yml:/config/configuration.yml:ro
      # users.yml is operator-managed and gitignored. Create it via:
      #   ./bootstrap.sh user-create authelia
      - ./users.yml:/config/users.yml:ro
      # The OIDC JWKS key is operator-generated and gitignored. Generate with:
      #   openssl genrsa -out authelia/private.pem 4096
      - ./private.pem:/config/private.pem:ro
      - authelia-data:/var/lib/authelia
    depends_on:
      ts-authelia:
        condition: service_healthy
    restart: unless-stopped

volumes:
  authelia-data:
