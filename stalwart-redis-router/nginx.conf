# stalwart-redis-router — nginx stream (L4 TCP) proxy that forwards
# Stalwart's Redis endpoint (STALWART_REDIS_MAGIC_NAME) to whichever node is
# CURRENTLY the primary (STALWART_REDIS_PRIMARY_MAGIC_NAME). See README
# "Stalwart Redis high availability".
#
# TRACKED TEMPLATE. Do not edit nginx.runtime.conf — it is generated from
# this file by `bootstrap.sh up stalwart-redis-router` (and re-generated on
# failover by the promote step), with __STALWART_REDIS_PRIMARY_ADDR__
# substituted from .env. The runtime file is gitignored.
#
# Single upstream, not a load-balancer: same reasoning as pg-router — one
# primary at a time, routed where you tell it, never guessed.

worker_processes 1;
events { worker_connections 1024; }

stream {
    upstream stalwart_redis_primary {
        # __STALWART_REDIS_PRIMARY_ADDR__ =
        #   ${STALWART_REDIS_PRIMARY_MAGIC_NAME}.${TS_TAILNET}:6379
        server __STALWART_REDIS_PRIMARY_ADDR__ max_fails=1 fail_timeout=5s;
    }

    server {
        # Stalwart reaches this on the router sidecar's tailnet interface as
        # ${STALWART_REDIS_MAGIC_NAME}.${TS_TAILNET}:6379 (the endpoint it
        # always used).
        listen 6379;
        listen [::]:6379;

        proxy_pass            stalwart_redis_primary;
        proxy_connect_timeout 5s;
        proxy_timeout         1h;
    }
}
